<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>京东商品导购</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5; 
            font-family: "Microsoft YaHei", sans-serif;
            padding: 50px;
        }

        .container {
            width: 900px;
            margin: 0 auto; 
            background: #fff; 
            padding: 20px 30px 40px;
            border: 2px solid #1b88ee; 
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #d8231d; 
            font-size: 32px;
            letter-spacing: 2px;
        }

        .product-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 20px; 
        }

        .product-card {
            width: 260px;
            height: 340px;
            background-color: #fff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .card-solid {
            border: 4px solid #8c69b0; 
            box-shadow: 0 0 10px rgba(0,0,0,0.15); 
        }

        .card-dashed {
            border: 4px dashed #a59cdb; 
            background-color: #fcfcfc;
        }

        .card-dashed:hover {
            cursor: pointer;
        }

        .product-card .title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            text-align: center;
        }

        .product-card .subtitle {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
        }

        .product-card .price {
            font-size: 18px;
            color: #e4393c; 
            margin-bottom: 20px;
        }

        .product-card img {
            width: 180px; 
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>京东商品导购</h1>
        </div>

        <div class="product-grid">
            
            <div class="product-card card-solid">
                <div class="title">麦包包 Vinhas单肩包</div>
                <div class="subtitle">领券满减</div>
                <div class="price">¥ 128</div>
                <img src="image5-2-1.jpg" alt="单肩包">
            </div>

            <div class="product-card card-dashed">
                <div class="title">优购.adidas休闲鞋</div>
                <div class="subtitle">限时抢购</div>
                <div class="price">¥ 365</div>
                <img src="image5-2-2.jpg" alt="休闲鞋">
            </div>

            <div class="product-card card-solid">
                <div class="title">优购.NB女子复古鞋</div>
                <div class="subtitle">限时抢购</div>
                <div class="price">¥ 299</div>
                <img src="image5-2-3.jpg" alt="复古鞋">
            </div>

            <div class="product-card card-solid">
                <div class="title">优购.VANS女子硫化鞋</div>
                <div class="subtitle">限时抢购</div>
                <div class="price">¥ 280</div>
                <img src="image5-2-4.jpg" alt="硫化鞋">
            </div>

            <div class="product-card card-solid">
                <div class="title">优购.匡威经典低帮鞋</div>
                <div class="subtitle">限时抢购</div>
                <div class="price">¥ 199</div>
                <img src="image5-2-5.jpg" alt="低帮鞋">
            </div>

            <div class="product-card card-solid">
                <div class="title">优购.Belle羊皮女鞋</div>
                <div class="subtitle">限时抢购</div>
                <div class="price">¥ 398</div>
                <img src="image5-2-6.jpg" alt="羊皮女鞋">
            </div>

        </div>
    </div>

</body>
</html>
